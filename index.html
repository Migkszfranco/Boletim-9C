<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boletim Digital</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Cabeçalho com título e subtítulo -->
  <header>
    <h1>Boletim Digital</h1>
    <p class="subtitulo">9º Ano — Estudante Exemplo</p>
  </header>

  <main>
    <!-- Área dos cards de resumo (serão preenchidos pelo JavaScript) -->
    <section class="cards" id="cards-resumo">
      <!-- Os cards serão inseridos aqui automaticamente -->
    </section>

    <!-- Área da tabela de disciplinas -->
    <section class="tabela-area">
      <h2>Notas por Disciplina</h2>

      <div class="tabela-wrapper">
        <table>
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody id="corpo-tabela">
            <!-- As linhas serão inseridas aqui pelo JavaScript -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Rodapé simples -->
  <footer>
    <p>Projeto escolar — dados fictícios</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
